<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover keeps the layout stable on iPhone (incl. notch/Dynamic Island) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Happy 15th, Ben 🎉</title>

  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --bg:        #0f172a; /* dark slate page background */
      --card:      #1e293b; /* card surface */
      --text:      #ffffff;
      --muted:     #94a3b8; /* secondary copy */
      --accent:    #3b82f6; /* blue */
      --accent-dk: #2563eb; /* blue, pressed state */
      --success:   #10b981; /* green */
      --error:     #f87171; /* soft red, non-alarming */
      --border:    #334155;
    }

    /* ============================================================
       RESET / BASE
       ============================================================ */
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      /* Native system font stack — no external fonts loaded. */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%; /* stop iOS resizing text on rotate */
    }

    body {
      min-height: 100vh;
      min-height: 100dvh; /* respects the iOS Safari toolbars */
      display: flex;
      align-items: center;
      justify-content: center;
      /* safe-area padding so the card never sits under the notch/home bar */
      padding: calc(24px + env(safe-area-inset-top)) 20px
               calc(24px + env(safe-area-inset-bottom));
    }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 22px 30px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .emoji {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 25px;
      line-height: 1.25;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 20px;
    }

    /* ============================================================
       PROGRESS — one pip per lock, filled as he solves them
       ============================================================ */
    .progress {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .pip {
      width: 34px;
      height: 5px;
      border-radius: 3px;
      background: var(--border);
      transition: background 0.35s ease;
    }

    .pip.is-active { background: var(--accent); }
    .pip.is-done   { background: var(--success); }

    .progress-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ============================================================
       PUZZLE BLOCK
       ============================================================ */
    .riddle {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
      text-align: left;
    }

    .riddle-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .riddle .intro,
    .riddle .outro {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #e2e8f0;
    }

    .riddle .outro {
      margin-top: 12px;
      font-weight: 600;
      color: var(--text);
    }

    /* The puzzle "material" — the thing he actually has to work on. */
    .material {
      margin: 12px 0 0;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.75);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.7;
      color: #f1f5f9;
    }

    /* Monospace list for the cipher puzzle, so the clues line up. */
    .material.mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      font-size: 14px;
      line-height: 1.9;
      letter-spacing: 0.01em;
    }

    /* ============================================================
       FORM CONTROLS
       ============================================================ */
    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"] {
      /* 16px exactly — anything smaller makes iOS Safari auto-zoom on focus. */
      font-size: 16px;
      font-family: inherit;
      width: 100%;
      padding: 14px 16px;
      color: var(--text);
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-appearance: none; /* strip the iOS default inner shadow */
      appearance: none;
    }

    input[type="text"]::placeholder { color: #64748b; }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    input[type="text"].is-invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.18);
    }

    button {
      font-size: 16px;
      font-family: inherit;
      font-weight: 600;
      width: 100%;
      padding: 14px 16px;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease, transform 0.08s ease;
    }

    button:active {
      background: var(--accent-dk);
      transform: scale(0.985);
    }

    /* ============================================================
       FEEDBACK — inline error + the "lock 1 opened" flash
       ============================================================ */
    .feedback {
      font-size: 14px;
      min-height: 20px;   /* reserve the row so nothing jumps */
      margin: 12px 0 0;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .feedback.is-visible { opacity: 1; }
    .feedback.is-error   { color: var(--error); }
    .feedback.is-good    { color: var(--success); font-weight: 600; }

    /* The nudge shown after repeated misses, so he never dead-ends. */
    .hint {
      display: none;
      margin: 12px 0 0;
      padding: 10px 12px;
      background: rgba(59, 130, 246, 0.10);
      border: 1px dashed rgba(59, 130, 246, 0.45);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      color: #cbd5e1;
      text-align: left;
    }

    .hint.is-visible { display: block; }
    .hint b { color: var(--accent); }

    /* Small shake — responsive without feeling punishing. */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-5px); }
      75%      { transform: translateX(5px); }
    }

    .shake { animation: shake 0.28s ease-in-out; }

    /* Gentle fade for each newly revealed puzzle. */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-up { animation: fadeUp 0.35s ease-out; }

    /* Respect users who ask for reduced motion. */
    @media (prefers-reduced-motion: reduce) {
      .shake, .fade-up { animation: none; }
      * { transition: none !important; }
    }

    /* ============================================================
       VIEW SWITCHING
       Both views live in the DOM at all times; a single `.hidden`
       class toggle swaps which one is shown.
       ============================================================ */
    .hidden { display: none; }

    #success .emoji { font-size: 52px; }

    #success h2 {
      color: var(--success);
      font-size: 24px;
      margin: 0 0 10px;
    }

    #success p {
      font-size: 16px;
      line-height: 1.6;
      color: #e2e8f0;
      margin: 0 0 16px;
    }

    .claim {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.45);
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      color: var(--success);
      margin: 0;
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- ========== UI STATE 1: the puzzles ========== -->
    <section id="puzzle">
      <div class="emoji" aria-hidden="true">🎂</div>
      <h1>Happy 15th Birthday, Ben!</h1>
      <p class="subtitle">
        Your gift is behind three locks. Crack all three and it's yours.
      </p>

      <!-- Progress pips: blue for the current lock, green once solved -->
      <div class="progress" aria-hidden="true">
        <span class="pip is-active" id="pip-1"></span>
        <span class="pip" id="pip-2"></span>
        <span class="pip" id="pip-3"></span>
        <span class="progress-label" id="progress-label">Lock 1 of 3</span>
      </div>

      <!-- All puzzle copy is injected here by the script (see PUZZLES below). -->
      <div class="riddle" id="riddle">
        <span class="riddle-label" id="riddle-label">Lock 1</span>
        <p class="intro" id="riddle-intro"></p>
        <div class="material" id="riddle-material"></div>
        <p class="outro" id="riddle-outro"></p>
      </div>

      <form id="answer-form" class="field" novalidate>
        <label for="answer" class="hidden">Your answer</label>
        <input
          id="answer"
          type="text"
          placeholder="Type your answer..."
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          aria-describedby="feedback"
        />
        <button type="submit">Submit</button>
      </form>

      <!-- aria-live so VoiceOver announces feedback without a page change -->
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

      <!-- Appears only after repeated misses -->
      <p id="hint" class="hint"></p>
    </section>

    <!-- ========== UI STATE 2: the reward (hidden until every lock opens) ========== -->
    <section id="success" class="hidden">
      <div class="emoji" aria-hidden="true">🎉</div>
      <h2>All Three Locks Open!</h2>
      <p>
        Nailed it, Ben. Court, controller, and concert band — you read all three.
        Fifteen looks good on you.
      </p>
      <p class="claim">Go claim your gift from Rayn!</p>
    </section>

  </main>

  <script>
    (function () {
      'use strict';

      /* ==========================================================
         THE PUZZLES
         Each entry is one lock. `accept` values are already lowercase
         and trimmed, so the comparison is a straight lookup.
         ========================================================== */
      var PUZZLES = [
        {
          label: 'Lock 1',
          intro: 'Four words. They describe what happens — and they also ' +
                 'spell what happens. Nothing here is buried deep; it\'s all up front.',
          material: 'Defenders&nbsp;&nbsp;Usually&nbsp;&nbsp;Never&nbsp;&nbsp;Know',
          mono: false,
          outro: 'What are those four words hiding?',
          /* Answer: DUNK — the first letter of each word. */
          accept: ['dunk', 'dunks', 'a dunk', 'the dunk', 'slam dunk',
                   'slamdunk', 'slam', 'dunking'],
          hint: 'Read only the <b>first letter</b> of each word, left to right.'
        },
        {
          label: 'Lock 2',
          intro: 'Four clues, four numbers. Turn each number into a letter ' +
                 '(A&nbsp;=&nbsp;1, B&nbsp;=&nbsp;2, C&nbsp;=&nbsp;3 … ), then read them in order.',
          material:
            '1. Points for a made shot inside the arc<br>' +
            '2. Players one team has on the floor<br>' +
            '3. Points for a made free throw<br>' +
            '4. Minutes in one half of college basketball',
          mono: true,
          outro: 'Four letters. One word — and it means something in all three ' +
                 'of your worlds.',
          /* 2, 5, 1, 20 → B, E, A, T → BEAT */
          accept: ['beat', 'beats', 'the beat', 'a beat'],
          hint: 'The numbers are <b>2, 5, 1, 20</b>. Now map them to letters ' +
                'and read straight across.'
        },
        {
          label: 'Lock 3',
          intro: 'Last one. Lock 1 lived at the front of the words and Lock 2 ' +
                 'lived in the numbers. This one lives in the cracks between ' +
                 'the words.',
          material: 'Down one at the half. If teenagers ever needed a drumline, ' +
                    'it&rsquo;s now.',
          mono: false,
          outro: 'Seven letters, sitting right there. You just turned it.',
          /* "...hal(FIFTEEN)agers..." — spaces and punctuation removed. */
          accept: ['fifteen', '15', 'fifteen years', 'fifteen years old',
                   '15 years', '15 years old'],
          hint: 'Delete every space and every mark, then look at the middle ' +
                'of the sentence: hal<b>fifteen</b>agers.'
        }
      ];

      var ERROR_TEXT = 'Access Denied. Try again.';
      var MISSES_BEFORE_HINT = 3;  /* nudge only after he's genuinely stuck */

      /* Cache the elements we touch. */
      var form     = document.getElementById('answer-form');
      var input    = document.getElementById('answer');
      var feedback = document.getElementById('feedback');
      var hint     = document.getElementById('hint');
      var puzzle   = document.getElementById('puzzle');
      var success  = document.getElementById('success');
      var riddle   = document.getElementById('riddle');
      var elLabel  = document.getElementById('riddle-label');
      var elIntro  = document.getElementById('riddle-intro');
      var elMat    = document.getElementById('riddle-material');
      var elOutro  = document.getElementById('riddle-outro');
      var pips     = [document.getElementById('pip-1'),
                      document.getElementById('pip-2'),
                      document.getElementById('pip-3')];
      var progressLabel = document.getElementById('progress-label');

      /* Defensive: if any node is missing, do nothing rather than throw. */
      if (!form || !input || !feedback || !puzzle || !success || !riddle) { return; }

      var current = 0;   /* index into PUZZLES */
      var misses  = 0;   /* wrong attempts on the current lock */

      /**
       * Normalize raw input for comparison: trim outer whitespace,
       * lowercase it, collapse internal runs of spaces, and drop
       * trailing punctuation like "dunk!" or "beat?".
       */
      function normalize(value) {
        return String(value)
          .trim()
          .toLowerCase()
          .replace(/\s+/g, ' ')
          .replace(/[.!?,]+$/, '');
      }

      /** True when the guess matches an accepted answer for this lock. */
      function isCorrect(guess) {
        return PUZZLES[current].accept.indexOf(normalize(guess)) !== -1;
      }

      /** Paint the current puzzle into the card. */
      function render() {
        var p = PUZZLES[current];

        elLabel.textContent = p.label;
        elIntro.innerHTML   = p.intro;
        elMat.innerHTML     = p.material;
        elOutro.innerHTML   = p.outro;
        elMat.className     = 'material' + (p.mono ? ' mono' : '');

        /* Progress pips: solved locks green, current lock blue. */
        for (var i = 0; i < pips.length; i++) {
          if (!pips[i]) { continue; }
          pips[i].classList.toggle('is-done',   i < current);
          pips[i].classList.toggle('is-active', i === current);
        }
        if (progressLabel) {
          progressLabel.textContent = 'Lock ' + (current + 1) + ' of ' + PUZZLES.length;
        }

        /* Replay the fade so a newly revealed lock reads as new. */
        riddle.classList.remove('fade-up');
        void riddle.offsetWidth; // force reflow so the animation restarts
        riddle.classList.add('fade-up');
      }

      /** Clear all feedback state (called as soon as he starts retyping). */
      function clearFeedback() {
        feedback.textContent = '';
        feedback.className = 'feedback';
        input.classList.remove('is-invalid', 'shake');
      }

      /** Show the inline error and nudge the input. No reload, no reset. */
      function showError() {
        feedback.textContent = ERROR_TEXT;
        feedback.className = 'feedback is-error is-visible';
        input.classList.add('is-invalid');

        /* Restart the shake each time by removing and re-adding the class. */
        input.classList.remove('shake');
        void input.offsetWidth;
        input.classList.add('shake');

        /* After a few honest misses, surface the hint for this lock. */
        if (misses >= MISSES_BEFORE_HINT && PUZZLES[current].hint) {
          hint.innerHTML = 'Stuck? ' + PUZZLES[current].hint;
          hint.classList.add('is-visible');
        }

        input.focus();
        input.select();
      }

      /** A lock is solved → brief green confirmation, then reveal the next. */
      function advance() {
        var remaining = PUZZLES.length - (current + 1);
        feedback.textContent = 'Lock ' + (current + 1) + ' open. ' +
          (remaining === 1 ? 'One to go.' : remaining + ' to go.');
        feedback.className = 'feedback is-good is-visible';

        current += 1;
        misses = 0;
        hint.classList.remove('is-visible');

        input.value = '';
        input.classList.remove('is-invalid', 'shake');
        render();

        /* Keep the keyboard up so he can go straight into lock 2. */
        input.focus();
      }

      /** Both locks open → swap UI State 1 for UI State 2. */
      function unlock() {
        clearFeedback();
        hint.classList.remove('is-visible');
        puzzle.classList.add('hidden');
        success.classList.remove('hidden');
        input.blur();  /* dismiss the iOS keyboard so the reward is visible */
      }

      /* Submit handler — covers both the button tap and the iOS "go" key. */
      form.addEventListener('submit', function (event) {
        event.preventDefault(); // never reload the page

        if (!isCorrect(input.value)) {
          misses += 1;
          showError();
          return;
        }

        if (current < PUZZLES.length - 1) {
          advance();
        } else {
          unlock();
        }
      });

      /* Typing again wipes the error so it never feels sticky. */
      input.addEventListener('input', function () {
        if (feedback.classList.contains('is-error')) { clearFeedback(); }
      });

      /* Paint lock 1 on load. */
      render();
    })();
  </script>
</body>
</html>
